name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pages is static hosting: the guestbook API route cannot run here, so it is left out of this build.
      # The guestbook then uses Supabase (NEXT_PUBLIC_SUPABASE_*), else NEXT_PUBLIC_GUESTBOOK_API, else the visitor's browser storage.
      - run: rm -rf src/app/api
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          # Guestbook storage for the static site (repository variables, Settings → Secrets and variables → Actions → Variables)
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GUESTBOOK_API: ${{ vars.NEXT_PUBLIC_GUESTBOOK_API }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
